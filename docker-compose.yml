services:
  api:
    build: ./server
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/url_shortner
      REDIS_URL: redis://redis:6379
      BASE_URL: http://localhost:4000
      ID_RANGE_SIZE: 1000000
      CACHE_TTL_SECONDS: 86400
      JWT_SECRET: change-this-in-production
      GOOGLE_CLIENT_ID: ""
    depends_on:
      - mongo
      - redis

  client:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      - api

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
